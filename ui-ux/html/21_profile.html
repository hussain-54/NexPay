<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>NexPay — Profile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:2400px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#05050A;color:#F9FAFB;-webkit-font-smoothing:antialiased}
.device{width:1080px;height:2400px;background:#05050A;position:relative;display:flex;flex-direction:column;overflow:hidden}
.status-bar{height:72px;padding:20px 48px 0;display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:600;color:#F9FAFB;flex-shrink:0}
.status-icons{display:flex;gap:12px;align-items:center}
.status-icons span{width:36px;height:18px;border-radius:4px;background:rgba(249,250,251,.25)}
.content{flex:1;padding:24px 48px 48px;display:flex;flex-direction:column;overflow:hidden}
.content.scroll{overflow-y:auto;padding-bottom:120px}
.logo-mark{width:120px;height:120px;border-radius:32px;background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 50%,#10B981 100%);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#fff;box-shadow:0 24px 80px rgba(99,102,241,.45)}
.logo-text{font-size:56px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#F9FAFB,#A5B4FC);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:64px;font-weight:800;line-height:1.1;letter-spacing:-2px;margin-bottom:16px}
h2{font-size:48px;font-weight:700;letter-spacing:-1px;margin-bottom:12px}
.subtitle{font-size:32px;color:#9CA3AF;line-height:1.5;margin-bottom:48px}
.label{font-size:26px;font-weight:600;color:#9CA3AF;margin-bottom:12px;display:block}
.input{width:100%;height:112px;background:#13131A;border:2px solid rgba(255,255,255,.08);border-radius:24px;padding:0 36px;font-size:32px;color:#F9FAFB;font-family:inherit;margin-bottom:28px}
.input:focus{outline:none;border-color:#6366F1;box-shadow:0 0 0 4px rgba(99,102,241,.25)}
.btn-primary{width:100%;height:112px;border:none;border-radius:28px;background:linear-gradient(135deg,#6366F1,#4F46E5);color:#fff;font-size:34px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 16px 48px rgba(99,102,241,.4);margin-top:auto}
.btn-secondary{width:100%;height:112px;border:2px solid rgba(255,255,255,.12);border-radius:28px;background:transparent;color:#F9FAFB;font-size:32px;font-weight:600;font-family:inherit;margin-top:16px}
.btn-accent{background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 16px 48px rgba(16,185,129,.35)}
.link{text-align:center;color:#6366F1;font-size:30px;font-weight:600;margin-top:32px}
.muted{color:#9CA3AF;font-size:28px}
.card{background:#13131A;border:1px solid rgba(255,255,255,.06);border-radius:32px;padding:36px;margin-bottom:24px}
.row{display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;background:rgba(99,102,241,.15);color:#A5B4FC;font-size:24px;font-weight:600}
.chip.success{background:rgba(16,185,129,.15);color:#6EE7B7}
.chip.danger{background:rgba(239,68,68,.15);color:#FCA5A5}
.nav-bottom{position:absolute;bottom:0;left:0;right:0;height:140px;background:rgba(19,19,26,.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-around;align-items:center;padding:0 24px 24px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:22px;color:#9CA3AF;font-weight:600}
.nav-item.active{color:#6366F1}
.nav-dot{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:24px}
.nav-item.active .nav-dot{background:rgba(99,102,241,.2)}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
.avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#10B981);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800}
.balance-label{font-size:28px;color:#9CA3AF;margin-bottom:8px}
.balance{font-size:72px;font-weight:800;letter-spacing:-2px}
.balance-sub{font-size:30px;color:#10B981;font-weight:600;margin-top:8px}
.actions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:36px 0}
.action-btn{display:flex;flex-direction:column;align-items:center;gap:16px}
.action-icon{width:100px;height:100px;border-radius:28px;background:#13131A;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:40px}
.action-label{font-size:24px;color:#9CA3AF;font-weight:600}
.tx-item{display:flex;align-items:center;gap:24px;padding:28px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.tx-icon{width:88px;height:88px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
.tx-icon.out{background:rgba(239,68,68,.12);color:#F87171}
.tx-icon.in{background:rgba(16,185,129,.12);color:#34D399}
.tx-icon.swap{background:rgba(99,102,241,.12);color:#A5B4FC}
.tx-title{font-size:32px;font-weight:700;margin-bottom:6px}
.tx-meta{font-size:26px;color:#9CA3AF}
.tx-amount{font-size:32px;font-weight:700;text-align:right}
.tx-amount.neg{color:#F87171}
.tx-amount.pos{color:#10B981}
.otp-row{display:flex;gap:20px;justify-content:center;margin:48px 0}
.otp-box{width:120px;height:140px;background:#13131A;border:2px solid rgba(255,255,255,.1);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700}
.progress-dots{display:flex;gap:12px;justify-content:center;margin-bottom:48px}
.progress-dots span{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.15)}
.progress-dots span.on{background:#6366F1;width:48px;border-radius:8px}
.upload-zone{border:2px dashed rgba(99,102,241,.4);border-radius:32px;padding:80px 48px;text-align:center;background:rgba(99,102,241,.06);margin:32px 0}
.hero-gradient{position:absolute;top:0;left:0;right:0;height:600px;background:radial-gradient(ellipse at 50% 0%,rgba(99,102,241,.35) 0%,transparent 70%);pointer-events:none}
.success-ring{width:200px;height:200px;border-radius:50%;background:rgba(16,185,129,.15);border:4px solid #10B981;display:flex;align-items:center;justify-content:center;font-size:96px;margin:48px auto}
.error-ring{width:200px;height:200px;border-radius:50%;background:rgba(239,68,68,.12);border:4px solid #EF4444;display:flex;align-items:center;justify-content:center;font-size:96px;margin:48px auto}
.loader{width:120px;height:120px;border:8px solid rgba(99,102,241,.2);border-top-color:#6366F1;border-radius:50%;animation:spin 1s linear infinite;margin:80px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px}
.qr-box{width:480px;height:480px;background:#fff;border-radius:32px;margin:32px auto;padding:32px;display:flex;align-items:center;justify-content:center}
.qr-pattern{width:100%;height:100%;background:repeating-linear-gradient(0deg,#05050A 0 8px,transparent 8px 16px),repeating-linear-gradient(90deg,#05050A 0 8px,transparent 8px 16px);opacity:.9}
.toggle-row{display:flex;background:#13131A;border-radius:20px;padding:8px;margin-bottom:32px}
.toggle-row button{flex:1;height:80px;border:none;border-radius:16px;font-size:28px;font-weight:600;font-family:inherit;background:transparent;color:#9CA3AF}
.toggle-row button.on{background:#6366F1;color:#fff}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:32px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.list-row:last-child{border:none}
.badge-premium{background:linear-gradient(135deg,#F59E0B,#D97706);padding:8px 20px;border-radius:999px;font-size:22px;font-weight:700;color:#05050A}
.back{font-size:32px;color:#9CA3AF;margin-bottom:24px}
</style>
</head>
<body>
<div class="device">

<div class="status-bar"><span>9:41</span><div class="status-icons"><span></span><span style="width:28px"></span><span style="width:52px;border-radius:6px"></span></div></div>
<div class="content scroll"><div style="text-align:center;margin:32px 0"><div class="avatar" style="width:160px;height:160px;font-size:64px;margin:0 auto 24px">M</div><h2>Maria Gonzalez</h2><p class="muted">maria.gonzalez@email.com · Verified</p></div>
<div class="card"><div class="row"><span class="muted">Member since</span><span>Jan 2025</span></div><div class="row" style="margin-top:20px"><span class="muted">Country</span><span>United States</span></div><div class="row" style="margin-top:20px"><span class="muted">Referral code</span><span style="color:#6366F1;font-weight:700">MARIA2026</span></div></div>
<button class="btn-primary">Edit profile</button>
<button class="btn-secondary">Download account statement</button></div>

</div>
</body>
</html>
