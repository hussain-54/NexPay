<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>NexPay Design System — Typography</title><style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#05050A;color:#F9FAFB;padding:64px;max-width:1200px;margin:0 auto;line-height:1.6}
a{color:#6366F1;text-decoration:none;font-weight:600}
nav{display:flex;gap:24px;margin-bottom:48px;flex-wrap:wrap}
nav a{padding:12px 20px;background:#13131A;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
h1{font-size:48px;font-weight:800;margin-bottom:16px;letter-spacing:-1px}
h2{font-size:32px;margin:40px 0 20px;color:#A5B4FC}
p{color:#9CA3AF;margin-bottom:16px}
.swatch{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}
.chip{width:160px;height:120px;border-radius:16px;display:flex;align-items:flex-end;padding:16px;font-weight:700;font-size:14px}
.card{background:#13131A;border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:32px;margin:16px 0}
.btn{display:inline-block;padding:16px 32px;border-radius:16px;font-weight:700;margin:8px 8px 8px 0}
.btn-p{background:linear-gradient(135deg,#6366F1,#4F46E5);color:#fff}
.btn-a{background:linear-gradient(135deg,#10B981,#059669);color:#fff}
.btn-d{background:#EF4444;color:#fff}
.type-h1{font-size:64px;font-weight:800;letter-spacing:-2px}
.type-h2{font-size:48px;font-weight:700}
.type-body{font-size:18px;color:#9CA3AF}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
</style></head><body>
<nav>
  <a href="index.html">Overview</a>
  <a href="colors.html">Colors</a>
  <a href="typography.html">Typography</a>
  <a href="components.html">Components</a>
</nav>
<h1>Typography</h1>
<p>Primary typeface: <strong style="color:#F9FAFB">Plus Jakarta Sans</strong> (Google Fonts).</p>
<div class="card"><p class="type-h1">Display H1</p><p class="type-body">64px / 800 — hero & balances</p></div>
<div class="card"><p class="type-h2">Heading H2</p><p class="type-body">48px / 700 — screen titles</p></div>
<div class="card"><p style="font-size:32px;font-weight:600">Body large — 32px inputs & list titles</p></div>
<div class="card"><p class="type-body">Body muted — 18–28px secondary copy #9CA3AF</p></div>
</body></html>
